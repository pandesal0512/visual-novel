<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle UI — Merged</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#ffffff; --paper-dark:#f0f0f0; --paper-mid:#e0e0e0;
    --ink:#000000; --ink-mid:#333; --ink-light:#666; --ink-faint:#aaa;
    --chaos-paper:#000; --chaos-paper-dark:#111; --chaos-paper-mid:#1a1a1a;
    --chaos-ink:#fff; --chaos-ink-mid:#ccc; --chaos-ink-light:#888; --chaos-ink-faint:#333;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#222;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    font-family:'Patrick Hand',cursive;
    padding:20px; flex-direction:column; gap:14px;
  }

  /* ── CONTROLS ── */
  .controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .toggle-btn {
    padding:6px 18px;
    font-family:'Caveat Brush',cursive; font-size:17px;
    border:2px solid #fff; cursor:pointer;
    clip-path:polygon(1% 0%,100% 2%,99% 100%,0% 98%);
    transition:all 0.15s; opacity:0.4;
  }
  .toggle-btn.active { opacity:1; transform:scale(1.04); }
  .toggle-btn.kare      { background:#fff; color:#000; }
  .toggle-btn.chaos-btn { background:#000; color:#fff; }
  .toggle-btn.mode-btn  { background:#555; color:#fff; border-color:#aaa; }
  .toggle-btn.exec-btn  { background:#800; color:#fff; border-color:#f88; }

  /* ── BATTLE SCREEN ── */
  .battle-screen {
    width:1200px; height:680px;
    position:relative; overflow:hidden;
    clip-path:polygon(0% 0.2%,100% 0%,99.8% 100%,0.1% 99.8%);
  }
  .kare-wrap  .battle-screen { background:var(--paper);       box-shadow:5px 5px 0 #111,10px 10px 0 #000; }
  .chaos-mode .battle-screen { background:var(--chaos-paper); box-shadow:5px 5px 0 #888,10px 10px 0 #bbb; }

  /* grain overlay (v2) */
  .battle-screen::after {
    content:''; position:absolute; inset:0;
    pointer-events:none; z-index:200;
    background-image:repeating-linear-gradient(
      45deg, transparent, transparent 3px,
      rgba(255,255,255,0.012) 3px, rgba(255,255,255,0.012) 4px
    );
  }

  /* ── CORNER MARKS (v2) ── */
  .crn { position:absolute; width:18px; height:18px; z-index:150; }
  .crn::before, .crn::after { content:''; position:absolute; }
  .crn::before { width:100%; height:2px; top:0; left:0; }
  .crn::after  { width:2px; height:100%; top:0; left:0; }
  .crn.tl { top:12px; left:12px; }
  .crn.tr { top:12px; right:12px; transform:scaleX(-1); }
  .crn.bl { bottom:12px; left:12px; transform:scaleY(-1); }
  .crn.br { bottom:12px; right:12px; transform:scale(-1); }
  .kare-wrap  .crn::before, .kare-wrap  .crn::after { background:var(--ink); }
  .chaos-mode .crn::before, .chaos-mode .crn::after { background:var(--chaos-ink); }

  /* ── SCENE LAYER (sprites) ── */
  .scene-layer { position:absolute; inset:0; z-index:1; pointer-events:none; }
  .char-sil {
    position:absolute;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  /* sprites float just above the slot strip */
  .single-mode .char-sil { bottom:206px; }
  .multi-mode  .char-sil { bottom:278px; }

  .char-sil .body {
    display:flex; align-items:center; justify-content:center;
    font-family:'Caveat',cursive; font-size:11px;
    text-align:center; line-height:1.4;
  }
  .char-sil .lbl {
    font-family:'Caveat',cursive; font-size:10px; padding:1px 5px;
  }
  .kare-wrap  .char-sil .body { width:130px; height:230px; background:rgba(0,0,0,0.07);      border:2px dashed rgba(0,0,0,0.18);    color:rgba(0,0,0,0.28); }
  .kare-wrap  .char-sil .lbl  { color:rgba(0,0,0,0.35); background:rgba(255,255,255,0.75); border:1px dashed rgba(0,0,0,0.18); }
  .chaos-mode .char-sil .body { width:130px; height:230px; background:rgba(255,255,255,0.06); border:2px dashed rgba(255,255,255,0.18); color:rgba(255,255,255,0.22); }
  .chaos-mode .char-sil .lbl  { color:rgba(255,255,255,0.28); background:rgba(0,0,0,0.6);   border:1px dashed rgba(255,255,255,0.15); }

  /* ── TOP BAR — gradient (v2 style, absolute positioned) ── */
  .top-bar {
    position:absolute; top:0; left:0; right:0;
    z-index:20;
    display:grid;
    grid-template-columns:1fr 155px 1fr;
    padding:12px 22px 32px;
    align-items:start;
  }
  .single-mode .top-bar { min-height:110px; }
  .multi-mode  .top-bar { min-height:130px; }
  .kare-wrap  .top-bar {
    background:linear-gradient(
      to bottom,
      rgba(255,255,255,0.98) 0%,
      rgba(255,255,255,0.90) 55%,
      rgba(255,255,255,0.00) 100%
    );
  }
  .chaos-mode .top-bar {
    background:linear-gradient(
      to bottom,
      rgba(0,0,0,0.98) 0%,
      rgba(0,0,0,0.90) 55%,
      rgba(0,0,0,0.00) 100%
    );
  }

  .center-col-inner {
    display:flex; flex-direction:column;
    align-items:center; gap:5px; padding-top:4px;
  }
  .team-label {
    font-family:'Caveat',cursive; font-size:11px;
    text-align:center; line-height:1.3;
  }
  .kare-wrap  .team-label { color:var(--ink-faint); }
  .chaos-mode .team-label { color:var(--chaos-ink-faint); }

  .stat-block { display:flex; flex-direction:column; gap:5px; }
  .stat-block.right { align-items:flex-end; }

  .char-name { font-family:'Caveat Brush',cursive; font-size:24px; }
  .kare-wrap  .char-name { color:var(--ink); }
  .chaos-mode .char-name { color:var(--chaos-ink); }

  .enemy-divider { width:100%; height:1px; margin:5px 0; }
  .kare-wrap  .enemy-divider { background:var(--ink-faint); }
  .chaos-mode .enemy-divider { background:var(--chaos-ink-faint); }

  .bar-row { display:flex; align-items:center; gap:8px; }
  .bar-row.flip { flex-direction:row-reverse; }

  .bar-label { font-family:'Caveat',cursive; font-size:14px; min-width:48px; }
  .kare-wrap  .bar-label { color:var(--ink-light); }
  .chaos-mode .bar-label { color:var(--chaos-ink-light); }
  .bar-label.r { text-align:right; }

  .bar-track {
    height:12px;
    clip-path:polygon(0.5% 15%,99.5% 0%,99.5% 85%,0.5% 100%);
  }
  .bar-track.player { width:185px; }
  .bar-track.enemy  { width:135px; }
  .kare-wrap  .bar-track { background:var(--paper-mid);       border:2px solid var(--ink); }
  .chaos-mode .bar-track { background:var(--chaos-paper-mid); border:2px solid var(--chaos-ink); }
  .bar-track.flip { transform:scaleX(-1); }

  .bar-fill { height:100%; }
  .kare-wrap  .bar-fill { background:var(--ink); }
  .chaos-mode .bar-fill { background:var(--chaos-ink); }
  .bar-fill.lo { background:repeating-linear-gradient(45deg,#000 0,#000 3px,#fff 3px,#fff 6px); }
  .chaos-mode .bar-fill.lo { background:repeating-linear-gradient(45deg,#fff 0,#fff 3px,#000 3px,#000 6px); }
  .bar-fill.rebuilding {
    background:repeating-linear-gradient(90deg,#000 0,#000 8px,#fff 8px,#fff 10px);
    animation:rebuild 1.5s linear infinite;
  }
  .chaos-mode .bar-fill.rebuilding {
    background:repeating-linear-gradient(90deg,#fff 0,#fff 8px,#000 8px,#000 10px);
    animation:rebuild 1.5s linear infinite;
  }
  @keyframes rebuild { from{background-position:0 0} to{background-position:10px 0} }

  .bar-nums { font-family:'Caveat',cursive; font-size:13px; white-space:nowrap; }
  .kare-wrap  .bar-nums { color:var(--ink-light); }
  .chaos-mode .bar-nums { color:var(--chaos-ink-light); }

  .chip-row { display:flex; gap:5px; flex-wrap:wrap; }
  .chip {
    display:inline-flex; align-items:center;
    padding:1px 7px;
    font-family:'Caveat',cursive; font-size:12px;
  }
  .kare-wrap  .chip { background:var(--paper-mid);       border:1.5px solid var(--ink-faint);        color:var(--ink-mid); }
  .chaos-mode .chip { background:var(--chaos-paper-mid); border:1.5px solid var(--chaos-ink-faint);  color:var(--chaos-ink-mid); }
  .chip.passive { font-style:italic; border-style:dashed; }

  /* ── INTENT BAR ── */
  .intent-bar {
    position:absolute; z-index:4;
    left:24px; right:24px;
    padding:7px 14px;
    display:none; align-items:baseline; gap:10px;
    transition:opacity 0.12s;
  }
  .intent-bar.visible { display:flex; }
  .single-mode .intent-bar { bottom:206px; }
  .multi-mode  .intent-bar { bottom:280px; }

  .kare-wrap  .intent-bar { background:rgba(248,248,248,0.92); border-left:4px solid var(--ink); border-top:1px solid var(--ink-faint); border-right:1px solid var(--ink-faint); border-bottom:1px solid var(--ink-faint); }
  .chaos-mode .intent-bar { background:rgba(10,10,10,0.94);   border-left:4px solid var(--chaos-ink); border-top:1px solid var(--chaos-ink-faint); border-right:1px solid var(--chaos-ink-faint); border-bottom:1px solid var(--chaos-ink-faint); }

  .intent-title { font-family:'Caveat Brush',cursive; font-size:17px; white-space:nowrap; }
  .kare-wrap  .intent-title { color:var(--ink); }
  .chaos-mode .intent-title { color:var(--chaos-ink); }

  .intent-desc { font-family:'Patrick Hand',cursive; font-size:13px; font-style:italic; }
  .kare-wrap  .intent-desc { color:var(--ink-light); }
  .chaos-mode .intent-desc { color:var(--chaos-ink-light); }

  .slot.enemy-slot.intent-active { outline:2px solid; outline-offset:-2px; }
  .kare-wrap  .slot.enemy-slot.intent-active { outline-color:var(--ink); }
  .chaos-mode .slot.enemy-slot.intent-active { outline-color:var(--chaos-ink); }

  /* ── SLOT STRIP ── */
  .slots-wrapper {
    position:absolute; left:0; right:0; z-index:5;
  }
  .single-mode .slots-wrapper { bottom:128px; }
  .multi-mode  .slots-wrapper { bottom:128px; }

  .slots-inner { display:flex; align-items:stretch; }
  .kare-wrap  .slots-inner { background:rgba(255,255,255,0.94); border-top:2px solid var(--ink-faint);        border-bottom:2px solid var(--ink-faint); }
  .chaos-mode .slots-inner { background:rgba(0,0,0,0.93);       border-top:2px solid var(--chaos-ink-faint); border-bottom:2px solid var(--chaos-ink-faint); }

  .slot-rows-col { flex:1; display:flex; flex-direction:column; overflow:hidden; }

  .slot-row {
    display:flex; align-items:center;
    gap:8px; padding:6px 14px;
    height:66px;
  }
  .single-mode .slot-row { height:68px; }
  .kare-wrap  .slot-row { background:rgba(255,255,255,0.92); }
  .chaos-mode .slot-row { background:rgba(0,0,0,0.92); }
  .slot-row + .slot-row { border-top:1px solid; }
  .kare-wrap  .slot-row + .slot-row { border-color:var(--ink-faint); }
  .chaos-mode .slot-row + .slot-row { border-color:var(--chaos-ink-faint); }

  .slot-row-label {
    font-family:'Caveat',cursive; font-size:10px;
    min-width:50px; white-space:nowrap; line-height:1.2;
  }
  .kare-wrap  .slot-row-label { color:var(--ink-faint); }
  .chaos-mode .slot-row-label { color:var(--chaos-ink-faint); }

  .slot-hbox { display:flex; gap:7px; flex:1; min-width:0; }

  .slot {
    flex:1; height:46px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative; cursor:pointer;
    transition:transform 0.1s, background 0.1s;
    clip-path:polygon(1% 2%,99% 0%,100% 97%,0% 100%);
    min-width:0;
  }
  .slot:hover { transform:translateY(-2px); }

  .kare-wrap  .slot.empty        { border:2px dashed var(--ink-faint);           background:var(--paper); }
  .kare-wrap  .slot.player-slot  { border:2.5px solid var(--ink);                background:var(--paper-dark); }
  .kare-wrap  .slot.enemy-slot   { border:2.5px solid var(--ink);                background:repeating-linear-gradient(-45deg,transparent 0,transparent 4px,rgba(0,0,0,.07) 4px,rgba(0,0,0,.07) 5px); }
  .chaos-mode .slot.empty        { border:2px dashed var(--chaos-ink-faint);     background:var(--chaos-paper); }
  .chaos-mode .slot.player-slot  { border:2.5px solid var(--chaos-ink);          background:var(--chaos-paper-dark); }
  .chaos-mode .slot.enemy-slot   { border:2.5px solid var(--chaos-ink);          background:repeating-linear-gradient(-45deg,transparent 0,transparent 4px,rgba(255,255,255,.07) 4px,rgba(255,255,255,.07) 5px); }

  .kare-wrap  .slot.empty.selectable:hover { background:rgba(0,0,0,0.10); }
  .chaos-mode .slot.empty.selectable:hover { background:rgba(255,255,255,0.10); }
  .kare-wrap  .slot.player-slot:hover { background:rgba(255,0,0,0.06); }
  .chaos-mode .slot.player-slot:hover { background:rgba(255,80,80,0.08); }

  .slot-inner { font-family:'Caveat',cursive; font-size:11px; }
  .kare-wrap  .slot-inner { color:var(--ink-faint); }
  .chaos-mode .slot-inner { color:var(--chaos-ink-faint); }

  .slot-tag {
    font-family:'Caveat',cursive; font-size:9px;
    font-weight:700; letter-spacing:1px; text-transform:uppercase;
    position:absolute; top:3px; left:4px;
  }
  .kare-wrap  .slot-tag                     { color:var(--ink-faint); }
  .kare-wrap  .slot.player-slot .slot-tag   { color:var(--ink); }
  .chaos-mode .slot-tag                     { color:var(--chaos-ink-faint); }
  .chaos-mode .slot.player-slot .slot-tag   { color:var(--chaos-ink); }

  .slot-name {
    font-family:'Caveat Brush',cursive; font-size:13px;
    text-align:center; padding:0 3px; line-height:1.1;
  }
  .kare-wrap  .slot-name { color:var(--ink); }
  .chaos-mode .slot-name { color:var(--chaos-ink); }

  .slot-val {
    font-family:'Caveat',cursive; font-size:10px;
    position:absolute; bottom:3px; right:4px;
  }
  .kare-wrap  .slot-val { color:var(--ink-light); }
  .chaos-mode .slot-val { color:var(--chaos-ink-light); }

  /* ── CONFIRM BUTTON ── */
  .confirm-col {
    display:flex; align-items:center; justify-content:center;
    padding:0 16px 0 10px; flex-shrink:0; min-width:110px;
  }
  .confirm-btn {
    padding:10px 18px;
    font-family:'Caveat Brush',cursive; font-size:18px;
    border:none; cursor:pointer; white-space:nowrap;
    clip-path:polygon(2% 0%,100% 1%,98% 100%,0% 99%);
    transition:background 0.12s, color 0.12s, transform 0.1s;
    letter-spacing:1px;
  }
  .kare-wrap  .confirm-btn { background:var(--ink);       color:var(--paper); }
  .chaos-mode .confirm-btn { background:var(--chaos-ink); color:var(--chaos-paper); }
  .kare-wrap  .confirm-btn:hover { background:var(--paper-mid);       color:var(--ink);       transform:rotate(-0.5deg) scale(1.04); }
  .chaos-mode .confirm-btn:hover { background:var(--chaos-paper-mid); color:var(--chaos-ink); transform:rotate(-0.5deg) scale(1.04); }

  /* ── TYPEBAR (v2) ── */
  .typebar { height:4px; flex-shrink:0; }
  .kare-wrap  .typebar { background-image:repeating-linear-gradient(90deg,#000 0,#000 2px,transparent 2px,transparent 4px); }
  .chaos-mode .typebar { background-image:repeating-linear-gradient(90deg,#fff 0,#fff 2px,transparent 2px,transparent 4px); }

  /* ── CARDS SECTION ── */
  .cards-section {
    position:absolute; bottom:0; left:0; right:0; height:128px;
    z-index:6;
    display:flex; flex-direction:column; gap:4px;
  }
  .kare-wrap  .cards-section { background:rgba(255,255,255,0.97); border-top:2px solid var(--ink-faint); }
  .chaos-mode .cards-section { background:rgba(0,0,0,0.97);       border-top:2px solid var(--chaos-ink-faint); }

  .cards-top-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:5px 18px 3px;
  }
  .cards-label { font-family:'Caveat',cursive; font-size:13px; }
  .kare-wrap  .cards-label { color:var(--ink-faint); }
  .chaos-mode .cards-label { color:var(--chaos-ink-faint); }

  .exp-track {
    height:6px; width:140px;
    clip-path:polygon(0% 10%,100% 0%,100% 90%,0% 100%);
  }
  .kare-wrap  .exp-track { background:var(--paper-mid);       border:1.5px solid var(--ink-faint); }
  .chaos-mode .exp-track { background:var(--chaos-paper-mid); border:1.5px solid var(--chaos-ink-faint); }
  .exp-fill { height:100%; }
  .kare-wrap  .exp-fill { background:var(--ink); }
  .chaos-mode .exp-fill { background:var(--chaos-ink); }

  .cards-row { display:flex; gap:9px; padding:0 18px 6px; }

  /* ── CARDS ── */
  .card {
    width:94px; height:88px;
    position:relative; display:flex; flex-direction:column;
    overflow:hidden; cursor:pointer; flex-shrink:0;
    transition:transform 0.15s, box-shadow 0.15s;
    clip-path:polygon(0% 1%,99% 0%,100% 99%,1% 100%);
  }
  .kare-wrap  .card { background:var(--paper);       border:2px solid var(--ink); }
  .chaos-mode .card { background:var(--chaos-paper); border:2px solid var(--chaos-ink); }

  .kare-wrap  .card:hover    { transform:translateY(-8px) rotate(-1deg);   box-shadow:3px 4px 0 var(--ink); }
  .chaos-mode .card:hover    { transform:translateY(-8px) rotate(-1deg);   box-shadow:3px 4px 0 var(--chaos-ink); }
  .kare-wrap  .card.selected { transform:translateY(-10px) rotate(0.5deg); box-shadow:4px 6px 0 var(--ink);       background:var(--paper-dark); }
  .chaos-mode .card.selected { transform:translateY(-10px) rotate(0.5deg); box-shadow:4px 6px 0 var(--chaos-ink); background:var(--chaos-paper-dark); }

  .card.on-cooldown { opacity:0.38; cursor:not-allowed; }
  .card.on-cooldown:hover { transform:none; box-shadow:none; }

  .card-type-bar { height:6px; }
  .kare-wrap  .card-type-bar.attack   { background:var(--ink); }
  .kare-wrap  .card-type-bar.barrier  { background:repeating-linear-gradient(90deg,#000 0,#000 4px,#fff 4px,#fff 8px); }
  .kare-wrap  .card-type-bar.energy   { background:repeating-linear-gradient(90deg,#000 0,#000 2px,#fff 2px,#fff 4px); }
  .kare-wrap  .card-type-bar.dodge    { background:repeating-linear-gradient(45deg,#000 0,#000 3px,#fff 3px,#fff 6px); }
  .kare-wrap  .card-type-bar.buff     { background:repeating-linear-gradient(-45deg,#000 0,#000 3px,#fff 3px,#fff 6px); }
  .kare-wrap  .card-type-bar.ultimate { height:9px; background:var(--ink); }
  .chaos-mode .card-type-bar.attack   { background:var(--chaos-ink); }
  .chaos-mode .card-type-bar.barrier  { background:repeating-linear-gradient(90deg,#fff 0,#fff 4px,#000 4px,#000 8px); }
  .chaos-mode .card-type-bar.energy   { background:repeating-linear-gradient(90deg,#fff 0,#fff 2px,#000 2px,#000 4px); }
  .chaos-mode .card-type-bar.dodge    { background:repeating-linear-gradient(45deg,#fff 0,#fff 3px,#000 3px,#000 6px); }
  .chaos-mode .card-type-bar.buff     { background:repeating-linear-gradient(-45deg,#fff 0,#fff 3px,#000 3px,#000 6px); }
  .chaos-mode .card-type-bar.ultimate { height:9px; background:var(--chaos-ink); }

  .card-icon-area {
    flex:1; display:flex; align-items:center; justify-content:center;
    font-size:20px; filter:grayscale(100%);
  }
  .chaos-mode .card-icon-area { filter:grayscale(100%) invert(1); }

  .card-body { padding:2px 5px 3px; }
  .kare-wrap  .card-body { border-top:1px solid var(--ink-faint); }
  .chaos-mode .card-body { border-top:1px solid var(--chaos-ink-faint); }

  .card-name { font-family:'Caveat Brush',cursive; font-size:13px; display:block; line-height:1.1; }
  .kare-wrap  .card-name { color:var(--ink); }
  .chaos-mode .card-name { color:var(--chaos-ink); }

  .card-stats {
    font-family:'Caveat',cursive; font-size:11px;
    display:flex; justify-content:space-between; margin-top:1px;
  }
  .kare-wrap  .card-stats { color:var(--ink-light); }
  .chaos-mode .card-stats { color:var(--chaos-ink-light); }

  .card-cost {
    font-family:'Caveat',cursive; font-size:10px;
    position:absolute; top:5px; right:5px;
    width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .kare-wrap  .card-cost { background:var(--ink);       color:var(--paper); }
  .chaos-mode .card-cost { background:var(--chaos-ink); color:var(--chaos-paper); }

  .cooldown-overlay {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Caveat Brush',cursive; font-size:28px;
    pointer-events:none;
  }
  .kare-wrap  .cooldown-overlay { background:rgba(255,255,255,0.78); color:var(--ink); }
  .chaos-mode .cooldown-overlay { background:rgba(0,0,0,0.78);       color:var(--chaos-ink); }

  /* ── SKILL POPUP ── */
  .skill-popup {
    position:absolute; left:24px; bottom:236px;
    width:240px; padding:14px 16px;
    z-index:20; display:none;
  }
  .skill-popup.visible { display:block; }
  .kare-wrap  .skill-popup { background:var(--paper-dark);       border:2px solid var(--ink); }
  .chaos-mode .skill-popup { background:var(--chaos-paper-dark); border:2px solid var(--chaos-ink); }

  .popup-name { font-family:'Caveat Brush',cursive; font-size:22px; display:block; }
  .kare-wrap  .popup-name { color:var(--ink); }
  .chaos-mode .popup-name { color:var(--chaos-ink); }

  .popup-stat { font-family:'Caveat',cursive; font-size:14px; display:block; margin-top:3px; }
  .kare-wrap  .popup-stat { color:var(--ink-light); }
  .chaos-mode .popup-stat { color:var(--chaos-ink-light); }

  .popup-divider { height:1px; margin:8px 0; }
  .kare-wrap  .popup-divider { background:var(--ink-faint); }
  .chaos-mode .popup-divider { background:var(--chaos-ink-faint); }

  .popup-desc { font-family:'Patrick Hand',cursive; font-size:13px; font-style:italic; }
  .kare-wrap  .popup-desc { color:var(--ink-light); }
  .chaos-mode .popup-desc { color:var(--chaos-ink-light); }

  /* ── CHAOS NUMBER BOX ── */
  .chaos-number-box {
    position:absolute; top:33%; left:34%;
    padding:10px 22px; z-index:15; text-align:center;
    display:none;
  }
  .chaos-number-box.visible { display:block; }
  .kare-wrap  .chaos-number-box { background:var(--paper-dark);  border:2px solid var(--ink); }
  .chaos-mode .chaos-number-box { background:var(--chaos-paper); border:2px solid var(--chaos-ink); animation:glitch 0.4s infinite; }

  .chaos-number-label { font-family:'Caveat',cursive; font-size:13px; margin-bottom:3px; }
  .kare-wrap  .chaos-number-label { color:var(--ink-light); }
  .chaos-mode .chaos-number-label { color:var(--chaos-ink-light); }

  .chaos-number-val { font-family:'Caveat Brush',cursive; font-size:48px; display:block; line-height:1; }
  .kare-wrap  .chaos-number-val { color:var(--ink); }
  .chaos-mode .chaos-number-val { color:var(--chaos-ink); }

  /* ── ENERGY WARNING ── */
  .energy-warning {
    position:absolute; z-index:25;
    top:38%; left:50%; transform:translateX(-50%);
    background:rgba(200,0,0,0.88);
    padding:12px 28px;
    font-family:'Caveat Brush',cursive; font-size:32px; color:#fff;
    display:none;
  }
  .energy-warning.visible { display:block; }

  /* ── REEL SPIN (chaos card shuffle) ── */
  @keyframes reelFlash {
    0%,100% { opacity:1; }
    15%     { opacity:0.15; }
    40%     { opacity:0.3; }
    70%     { opacity:0.2; }
  }
  .card.reel-active {
    animation: reelFlash 0.05s linear infinite;
    pointer-events: none;
  }
  .card.reel-active .card-icon-area {
    font-family: 'Caveat Brush', cursive;
    letter-spacing: -2px;
  }
  /* Subtle scanline effect over whole cards bar during shuffle */
  .chaos-mode .cards-section.shuffling::before {
    content: '';
    position: absolute; inset: 0; z-index: 30;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent 0, transparent 3px,
      rgba(255,255,255,0.04) 3px, rgba(255,255,255,0.04) 4px
    );
  }

  /* ── ANIMATIONS ── */
  @keyframes glitch {
    0%,90%,100% { transform:none }
    92% { transform:translateX(-3px) skewX(-2deg) }
    95% { transform:translateX(3px) }
    97% { transform:translateX(-1px) }
  }
  @keyframes glitch-text {
    0%,87%,100% { opacity:1; letter-spacing:normal }
    88% { opacity:0.4; letter-spacing:3px }
    91% { opacity:0.7 }
  }
  @keyframes slots-shake {
    0%,91%,100% { transform:none }
    92% { transform:translate(1px,-1px) rotate(0.2deg) }
    94% { transform:translate(-1px,1px) rotate(-0.2deg) }
  }
  @keyframes hp-glitch {
    0%,90%,100% { transform:none; opacity:1 }
    92% { transform:translateX(-4px); opacity:0.6 }
    94% { transform:translateX(3px) }
    96% { transform:translateX(-1px) }
  }

  .chaos-glitch      { animation:glitch 7s infinite; display:inline-block; }
  .chaos-glitch-text { animation:glitch-text 5s infinite; display:inline-block; }
  .chaos-shake       { animation:slots-shake 8s infinite; }
  .chaos-hp          { animation:hp-glitch 4s infinite; display:inline-block; }

  /* ── TAUNT BUBBLE ── */
  .taunt-bubble {
    position: absolute;
    z-index: 10;
    background: #000;
    padding: 10px 14px;
    max-width: 220px;
    pointer-events: none;
    animation: tauntIn 0.15s ease forwards;
  }
  /* tail */
  .taunt-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 22px;
    width: 0; height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 8px solid #000;
  }
  /* chaos inverted */
  .chaos-mode .taunt-bubble {
    background: #fff;
  }
  .chaos-mode .taunt-bubble::after {
    border-top-color: #fff;
  }
  /* positions */
  .taunt-bubble.pos-single { right: 108px; top: 95px; }
  .taunt-bubble.pos-left   { right: 220px; top: 95px; }
  .taunt-bubble.pos-right  { right:  60px; top: 95px; }

  .taunt-speaker {
    font-family: 'Caveat', cursive;
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 3px;
  }
  .chaos-mode .taunt-speaker { color: rgba(0,0,0,0.45); }

  .taunt-text {
    font-family: 'Patrick Hand', cursive;
    font-size: 13px;
    color: #fff;
    line-height: 1.4;
    font-style: italic;
  }
  .chaos-mode .taunt-text { color: #000; }

  @keyframes tauntIn {
    from { transform: translateY(-6px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  @keyframes tauntOut {
    from { transform: translateY(0);    opacity: 1; }
    to   { transform: translateY(-4px); opacity: 0; }
  }
</style>
</head>
<body>

<!-- ── CONTROLS ── -->
<div class="controls">
  <button class="toggle-btn kare active"     id="btn-kare"   onclick="setMode('kare')">Kare Mode</button>
  <button class="toggle-btn chaos-btn"       id="btn-chaos"  onclick="setMode('chaos')">Chaos Mode</button>
  <button class="toggle-btn mode-btn active" id="btn-single" onclick="setEnemyMode('single')">Single Enemy</button>
  <button class="toggle-btn mode-btn"        id="btn-multi"  onclick="setEnemyMode('multi')">Multi Enemy</button>
  <button class="toggle-btn exec-btn"        id="btn-exec"   onclick="toggleExec()">Show Damage Box (Execution Phase)</button>
</div>

<!-- ── BATTLE SCREEN ── -->
<div id="screen-wrap" class="kare-wrap single-mode">
<div class="battle-screen" id="battle-screen">

  <!-- corner marks (v2) -->
  <div class="crn tl"></div><div class="crn tr"></div>
  <div class="crn bl"></div><div class="crn br"></div>

  <!-- sprites — z-index 1, visible through gradient top bar (v2 layout) -->
  <div class="scene-layer" id="scene-layer"></div>

  <!-- TOP BAR — gradient fade, absolute (v2 visual style) -->
  <div class="top-bar" id="top-bar">

    <!-- PLAYER -->
    <div class="stat-block">
      <span class="char-name" id="player-name">Kare</span>
      <div class="bar-row">
        <span class="bar-label">HP</span>
        <div class="bar-track player"><div class="bar-fill" style="width:72%;"></div></div>
        <span class="bar-nums">144 / 200</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Energy</span>
        <div class="bar-track player"><div class="bar-fill" style="width:60%;"></div></div>
        <span class="bar-nums">12 / 20</span>
      </div>
      <div class="chip-row">
        <div class="chip">DEF 8</div>
        <div class="chip">DMG +5 (2t)</div>
      </div>
    </div>

    <!-- CENTRE -->
    <div class="center-col-inner">
      <div class="turn-badge" id="turn-badge">Turn 4 · 4 slots</div>
      <div class="team-label" id="team-label"></div>
    </div>

    <!-- ENEMIES (filled by JS) -->
    <div class="stat-block right" id="enemy-stats"></div>
  </div>

  <!-- INTENT BAR — hidden until enemy slot clicked -->
  <div class="intent-bar" id="intent-bar">
    <span class="intent-title" id="intent-title"></span>
    <span class="intent-desc"  id="intent-desc"></span>
  </div>

  <!-- TAUNT BUBBLE — shown via showTaunt() -->
  <div class="taunt-bubble pos-single" id="taunt-bubble" style="display:none;">
    <div class="taunt-speaker" id="taunt-speaker"></div>
    <div class="taunt-text"    id="taunt-text"></div>
  </div>

  <!-- SLOT STRIP -->
  <div class="slots-wrapper" id="slots-wrapper">

      <div class="slot-rows-col" id="slot-rows-col">
        <!-- filled by JS -->
      </div>
      <div class="confirm-col">
        <button class="confirm-btn" id="confirm-btn">CONFIRM</button>
      </div>
    </div>
  </div>

  <!-- CARDS SECTION (typebar from v2, content from v1) -->
  <div class="cards-section" id="cards-section">
    <div class="typebar"></div>
    <div class="cards-top-row">
      <span class="cards-label">your cards</span>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="cards-label">next skill:</span>
        <div class="exp-track"><div class="exp-fill" style="width:45%;"></div></div>
      </div>
    </div>
    <div class="cards-row" id="cards-row">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- SKILL POPUP (hover only, positioned above cards) -->
  <div class="skill-popup" id="skill-popup">
    <span class="popup-name" id="popup-name">punch</span>
    <span class="popup-stat" id="popup-cost">Cost: 4 Energy</span>
    <span class="popup-stat" id="popup-dmg">Damage: 13</span>
    <span class="popup-stat" id="popup-cd">Cooldown: 2 turns</span>
    <div class="popup-divider"></div>
    <span class="popup-desc" id="popup-desc">Powerful punch.</span>
  </div>

  <!-- CHAOS NUMBER BOX (hidden during selection phase) -->
  <div class="chaos-number-box" id="chaos-number-box">
    <div class="chaos-number-label">DAMAGE</div>
    <span class="chaos-number-val" id="chaos-number-val">??</span>
  </div>

  <!-- ENERGY WARNING -->
  <div class="energy-warning" id="energy-warning">NOT ENOUGH ENERGY</div>

</div>
</div>

<script>
// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let isKare   = true;
let isMulti  = false;
let isExec   = false;
let selectedSkill = null;
let chaosCurrentHand = null; // null = use default first 4 chaos cards
let isShuffling = false;

// ─────────────────────────────────────────
// DATA
// ─────────────────────────────────────────
const kareCards = [
  { name:'punch',           cost:4,  dmg:13, cd:2, type:'attack',  icon:'👊', desc:'Powerful punch.' },
  { name:'slap',            cost:2,  dmg:6,  cd:0, type:'attack',  icon:'🖐', desc:'Standard strike.' },
  { name:'evade',           cost:4,  dmg:0,  cd:4, type:'dodge',   icon:'💨', desc:'Dodges next attack.' },
  { name:'Defense',         cost:3,  dmg:8,  cd:2, type:'barrier', icon:'🛡', desc:'Gain 8 Defense.', onCd:true },
  { name:'yummers',         cost:0,  dmg:0,  cd:2, type:'energy',  icon:'🍔', desc:'Recover 10 energy.', onCd:true, nrg:10 },
  { name:'super cool kick', cost:6,  dmg:20, cd:6, type:'ultimate',icon:'💥', desc:"kick that's it." },
];

// Full chaos skill pool matching the actual game script
const chaosCardPool = [
  { name:'interitus',     cost:3,  dmg:0, cd:0, type:'attack',  icon:'〜〜', desc:'1–20 damage... probably', chaos:true },
  { name:'Embrace',       cost:5,  dmg:0, cd:2, type:'barrier', icon:'◎',   desc:'1–50 Defense. who knows', chaos:true },
  { name:'Entropy',       cost:0,  dmg:0, cd:3, type:'energy',  icon:'∿',   desc:'everything falls apart eventually. might as well use it', chaos:true },
  { name:'Cataclysm',     cost:7,  dmg:0, cd:3, type:'attack',  icon:'⚡',  desc:'1–30 damage... maybe', chaos:true },
  { name:'dissolutum',    cost:6,  dmg:0, cd:2, type:'dodge',   icon:'⊘',   desc:'Shift out of reality.', chaos:true },
  { name:'playing rough', cost:6,  dmg:0, cd:3, type:'buff',    icon:'R',   desc:'1–50 Damage Buff. or 1. who knows.', chaos:true },
  { name:'??????',        cost:25, dmg:0, cd:4, type:'ultimate',icon:'????',desc:'1–60 damage... ??? ?????', chaos:true },
  { name:'Unravel',       cost:4,  dmg:0, cd:3, type:'buff',    icon:'U',   desc:'Strips all buffs currently on the enemy.', chaos:true },
  { name:'Fracture',      cost:5,  dmg:0, cd:3, type:'attack',  icon:'X',   desc:'Destroys enemy barrier completely, or deals 1–10 damage.', chaos:true },
  { name:'Corrode',       cost:5,  dmg:0, cd:2, type:'attack',  icon:'C',   desc:"Reduced damage for enemy's next 2–3 attacks.", chaos:true },
  { name:'Inversion',     cost:6,  dmg:0, cd:3, type:'buff',    icon:'I',   desc:'Flips enemy damage buff to a penalty.', chaos:true },
  { name:'Collapse',      cost:8,  dmg:0, cd:3, type:'barrier', icon:'L',   desc:"Nullifies enemy's very next action.", chaos:true },
  { name:'Leech',         cost:6,  dmg:0, cd:3, type:'buff',    icon:'H',   desc:'Steals a buff from the enemy and applies it to yourself.', chaos:true },
  { name:'Overload',      cost:7,  dmg:0, cd:3, type:'attack',  icon:'O',   desc:'Enemy takes damage equal to their current barrier, then removes it.', chaos:true },
];
// The first 7 are the "core" pool; extras get interleaved as unlocks
// For the mockup default hand we show the first 4 core cards
const chaosCards = chaosCardPool.slice(0, 4);

const singleEnemyStats = `
  <span class="char-name" id="enemy0-name">Butter</span>
  <div class="bar-row flip">
    <span class="bar-label r">HP</span>
    <div class="bar-track enemy flip"><div class="bar-fill lo" style="width:45%;"></div></div>
    <span class="bar-nums">90 / 200</span>
  </div>
  <div class="chip-row" style="justify-content:flex-end;">
    <div class="chip passive">RECKONING</div>
  </div>
`;

const multiEnemyStats = `
  <span class="char-name">Butter</span>
  <div class="bar-row flip">
    <span class="bar-label r">HP</span>
    <div class="bar-track enemy flip"><div class="bar-fill lo" style="width:35%;"></div></div>
    <span class="bar-nums">175 / 500</span>
  </div>
  <div class="chip-row" style="justify-content:flex-end;">
    <div class="chip passive">RECKONING</div>
  </div>
  <div class="enemy-divider"></div>
  <span class="char-name">Ava</span>
  <div class="bar-row flip">
    <span class="bar-label r">HP</span>
    <div class="bar-track enemy flip"><div class="bar-fill rebuilding" style="width:55%;"></div></div>
    <span class="bar-nums">220 / 400</span>
  </div>
  <div class="chip-row" style="justify-content:flex-end;">
    <div class="chip passive">STILL STANDING</div>
    <div class="chip passive">MONUMENT (4)</div>
  </div>
`;

const singleSlotRows = `
  <div class="slot-row">
    <span class="slot-row-label">battle<br>row</span>
    <div class="slot-hbox">
      <div class="slot player-slot"><span class="slot-tag">YOU</span><span class="slot-name">punch</span><span class="slot-val">13</span></div>
      <div class="slot enemy-slot" data-intent="Butter: SENTENCE — 25 damage" data-desc="the verdict has been decided. there is no appeal. there is no negotiation."><span class="slot-tag">ENEMY</span><span class="slot-name">SENTENCE</span><span class="slot-val">25</span></div>
      <div class="slot player-slot" title="Click to remove"><span class="slot-tag">YOU</span><span class="slot-name">evade</span><span class="slot-val">—</span></div>
      <div class="slot empty selectable"><div class="slot-inner">— open —</div></div>
    </div>
  </div>
`;

const multiSlotRows = `
  <div class="slot-row">
    <span class="slot-row-label">Butter's<br>row</span>
    <div class="slot-hbox">
      <div class="slot player-slot"><span class="slot-tag">YOU</span><span class="slot-name">punch</span><span class="slot-val">13</span></div>
      <div class="slot enemy-slot" data-intent="Butter: SENTENCE — 25 damage" data-desc="the verdict has been decided. there is no appeal. there is no negotiation."><span class="slot-tag">ENEMY</span><span class="slot-name">SENTENCE</span><span class="slot-val">25</span></div>
      <div class="slot player-slot"><span class="slot-tag">YOU</span><span class="slot-name">evade</span><span class="slot-val">—</span></div>
      <div class="slot empty selectable"><div class="slot-inner">— open —</div></div>
      <div class="slot enemy-slot" data-intent="Butter: VERDICT — defense" data-desc="law does not bend. neither do I. gains 5 Defense."><span class="slot-tag">ENEMY</span><span class="slot-name">VERDICT</span><span class="slot-val">+def</span></div>
      <div class="slot empty selectable"><div class="slot-inner">— open —</div></div>
    </div>
  </div>
  <div class="slot-row">
    <span class="slot-row-label">Ava's<br>row</span>
    <div class="slot-hbox">
      <div class="slot empty selectable"><div class="slot-inner">— open —</div></div>
      <div class="slot enemy-slot" data-intent="Ava: DRAIN — 33,333 damage" data-desc="the city crumbles. Ava takes damage from the ongoing destruction. once per turn."><span class="slot-tag">ENEMY</span><span class="slot-name">DRAIN</span><span class="slot-val">33k</span></div>
      <div class="slot player-slot"><span class="slot-tag">YOU</span><span class="slot-name">Embrace</span><span class="slot-val">???</span></div>
      <div class="slot empty selectable"><div class="slot-inner">— open —</div></div>
      <div class="slot enemy-slot" data-intent="Ava: MONUMENT — barrier" data-desc="gains barrier equal to the number of turns that have passed."><span class="slot-tag">ENEMY</span><span class="slot-name">MONUMENT</span><span class="slot-val">barrier</span></div>
      <div class="slot empty selectable"><div class="slot-inner">— open —</div></div>
    </div>
  </div>
`;

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function render() {
  const wrap  = document.getElementById('screen-wrap');
  const scene = document.getElementById('scene-layer');

  wrap.className = (isKare ? 'kare-wrap' : 'chaos-mode') + ' ' + (isMulti ? 'multi-mode' : 'single-mode');

  // Player name / HP
  const playerName = document.getElementById('player-name');
  if (!isKare) {
    playerName.innerHTML = '<span class="chaos-glitch">Chaos</span>';
    document.querySelectorAll('.bar-nums')[0].innerHTML = '<span class="chaos-hp">3#9</span> / 500';
  } else {
    playerName.textContent = 'Kare';
    document.querySelectorAll('.bar-nums')[0].textContent = '144 / 200';
  }

  // Turn badge & team label
  document.getElementById('turn-badge').textContent = isMulti ? 'Turn 4 · 6 slots' : 'Turn 4 · 4 slots';
  const teamLabel = document.getElementById('team-label');
  if (isMulti) {
    teamLabel.style.color = isKare ? 'var(--ink-faint)' : 'var(--chaos-ink-faint)';
    teamLabel.innerHTML = 'Butter + Ava · team fight';
  } else {
    teamLabel.textContent = '';
  }

  // Enemy stats
  document.getElementById('enemy-stats').innerHTML = isMulti ? multiEnemyStats : singleEnemyStats;

  // Sprites
  scene.innerHTML = '';
  const addSil = (label, leftPx, rightPx) => {
    const d = document.createElement('div');
    d.className = 'char-sil';
    if (leftPx  !== null) d.style.left  = leftPx  + 'px';
    if (rightPx !== null) d.style.right = rightPx + 'px';
    d.innerHTML = `<div class="body">${label}.png</div><div class="lbl">${label}</div>`;
    scene.appendChild(d);
  };
  const playerLabel = isKare ? 'kare_idle' : 'chaos_idle';
  if (isMulti) {
    addSil(playerLabel, 240, null);
    addSil('butter_idle', null, 310);
    addSil('ava_idle',    null, 130);
  } else {
    addSil(playerLabel, 380, null);
    addSil('butter_idle', null, 320);
  }

  // Slot rows
  document.getElementById('slot-rows-col').innerHTML = isMulti ? multiSlotRows : singleSlotRows;

  // Chaos shake on slots
  const si = document.getElementById('slots-inner');
  if (!isKare) si.classList.add('chaos-shake');
  else         si.classList.remove('chaos-shake');

  // Cards
  buildCards();

  // Wire enemy slot clicks → intent bar
  wireEnemySlots();

  // Chaos number box (execution phase only)
  const cnb = document.getElementById('chaos-number-box');
  if (isExec && !isKare) {
    cnb.classList.add('visible');
    animateChaosNumber();
  } else {
    cnb.classList.remove('visible');
  }

  // Reset popup + selection
  document.getElementById('skill-popup').classList.remove('visible');
  selectedSkill = null;
}

function buildCards() {
  const row   = document.getElementById('cards-row');
  const cards = isKare ? kareCards : (chaosCurrentHand || chaosCards);
  row.innerHTML = '';

  cards.forEach((sk) => {
    const el = document.createElement('div');
    el.className = 'card' + (sk.onCd ? ' on-cooldown' : '');
    if (sk.chaos && sk.name === '??????') el.style.animation = 'glitch 3s infinite';

    const nrgText = sk.nrg ? sk.nrg + ' nrg' : (sk.dmg > 0 ? sk.dmg + ' dmg' : sk.type);
    const cdText  = sk.cd > 0 ? `<span>cd:${sk.cd}</span>` : '';
    const isqm    = sk.name === '??????';
    const iconStyle = isqm ? 'font-size:13px;animation:glitch 2s infinite;' : '';

    el.innerHTML = `
      <div class="card-type-bar ${sk.type}"></div>
      <div class="card-cost">${sk.cost}</div>
      <div class="card-icon-area" style="${iconStyle}">${sk.icon}</div>
      <div class="card-body">
        <span class="card-name" style="${isqm ? 'animation:glitch 4s infinite;' : ''}">${sk.name}</span>
        <div class="card-stats"><span>${nrgText}</span>${cdText}</div>
      </div>
      ${sk.onCd ? `<div class="cooldown-overlay">${sk.cd}</div>` : ''}
    `;

    if (!sk.onCd) {
      // click → select card + show popup; click same card again to deselect + hide
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const popup = document.getElementById('skill-popup');
        const isSame = selectedSkill === sk.name;

        document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        selectedSkill = null;
        popup.classList.remove('visible');

        if (!isSame) {
          el.classList.add('selected');
          selectedSkill = sk.name;
          document.getElementById('popup-name').textContent = sk.name;
          document.getElementById('popup-cost').textContent = `Cost: ${sk.cost} Energy`;
          document.getElementById('popup-dmg').textContent  = sk.dmg > 0 ? `Damage: ${sk.dmg}` : (sk.nrg ? `Energy regen: ${sk.nrg}` : `Type: ${sk.type}`);
          document.getElementById('popup-cd').textContent   = sk.cd > 0 ? `Cooldown: ${sk.cd} turns` : '';
          document.getElementById('popup-desc').textContent = sk.desc;
          popup.classList.add('visible');
        }

        document.querySelectorAll('.slot.empty').forEach(s => {
          if (selectedSkill) s.classList.add('selectable');
          else               s.classList.remove('selectable');
        });
      });
    }

    row.appendChild(el);
  });
}

function animateChaosNumber() {
  const el    = document.getElementById('chaos-number-val');
  const final = Math.floor(Math.random() * 20) + 1;
  const chars = '$#%^&*@!?~<>0123456789';
  let i = 0;
  const iv = setInterval(() => {
    if (i < 22) {
      el.textContent = chars[Math.floor(Math.random()*chars.length)] + chars[Math.floor(Math.random()*chars.length)];
    } else {
      el.textContent = String(final).padStart(2,'0');
      clearInterval(iv);
    }
    i++;
  }, 40);
}

function wireEnemySlots() {
  const bar      = document.getElementById('intent-bar');
  const titleEl  = document.getElementById('intent-title');
  const descEl   = document.getElementById('intent-desc');
  let activeSlot = null;

  document.querySelectorAll('.slot.enemy-slot').forEach(slot => {
    slot.style.cursor = 'pointer';
    slot.addEventListener('click', (e) => {
      e.stopPropagation();
      const intent = slot.dataset.intent;
      const desc   = slot.dataset.desc;
      if (!intent) return;

      if (activeSlot === slot) {
        bar.classList.remove('visible');
        slot.classList.remove('intent-active');
        activeSlot = null;
        return;
      }
      if (activeSlot) activeSlot.classList.remove('intent-active');
      titleEl.textContent = intent;
      descEl.textContent  = desc || '';
      bar.classList.add('visible');
      slot.classList.add('intent-active');
      activeSlot = slot;
    });
  });

  // clicking elsewhere closes intent bar and skill popup
  document.getElementById('battle-screen').addEventListener('click', (e) => {
    if (!e.target.closest('.slot.enemy-slot') && !e.target.closest('#intent-bar')) {
      bar.classList.remove('visible');
      if (activeSlot) { activeSlot.classList.remove('intent-active'); activeSlot = null; }
    }
    if (!e.target.closest('.card')) {
      document.getElementById('skill-popup').classList.remove('visible');
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      selectedSkill = null;
      document.querySelectorAll('.slot.empty').forEach(s => s.classList.remove('selectable'));
    }
  }, true);
}

// ─────────────────────────────────────────
// CHAOS CARD SHUFFLE
// ─────────────────────────────────────────
const REEL_SYMBOLS = '$#%^&*@!?~<>||~~∿⊘◎〜';

function animateCardReel(cardEl, newSkill, delay) {
  return new Promise(resolve => {
    const iconEl  = cardEl.querySelector('.card-icon-area');
    const nameEl  = cardEl.querySelector('.card-name');
    const statEl  = cardEl.querySelector('.card-stats span');
    const barEl   = cardEl.querySelector('.card-type-bar');
    const costEl  = cardEl.querySelector('.card-cost');

    setTimeout(() => {
      // Flash overlay during spin
      cardEl.classList.add('reel-active');
      let frame = 0;
      const totalFrames = 30; // ~1.5s at 50ms

      const iv = setInterval(() => {
        if (frame < 22) {
          // Fast scramble phase
          const rand = () => REEL_SYMBOLS[Math.floor(Math.random() * REEL_SYMBOLS.length)];
          iconEl.textContent  = rand() + rand();
          iconEl.style.opacity = String(0.2 + Math.random() * 0.4);
          nameEl.textContent  = rand() + rand() + rand() + rand();
        } else if (frame < 28) {
          // Slow-down phase: alternate between new icon and symbols
          iconEl.style.opacity = '0.7';
          iconEl.textContent   = frame % 2 === 0 ? newSkill.icon : REEL_SYMBOLS[Math.floor(Math.random() * REEL_SYMBOLS.length)];
          nameEl.textContent   = frame % 2 === 0 ? newSkill.name : '??';
        } else {
          clearInterval(iv);
          // Final land
          iconEl.textContent  = newSkill.icon;
          iconEl.style.opacity = '1';
          nameEl.textContent  = newSkill.name;
          if (statEl) statEl.textContent = newSkill.nrg ? newSkill.nrg + ' nrg' : (newSkill.dmg > 0 ? newSkill.dmg + ' dmg' : newSkill.type);
          if (costEl) costEl.textContent = String(newSkill.cost);
          // Update type bar class
          if (barEl) {
            barEl.className = 'card-type-bar ' + newSkill.type;
          }
          cardEl.classList.remove('reel-active');
          // Brief bounce — nudge down then up
          cardEl.style.transition = 'transform 0.06s';
          cardEl.style.transform  = 'translateY(4px)';
          setTimeout(() => {
            cardEl.style.transform = 'translateY(-3px)';
            setTimeout(() => {
              cardEl.style.transform = '';
              cardEl.style.transition = '';
              resolve();
            }, 80);
          }, 60);
        }
        frame++;
      }, 50);
    }, delay);
  });
}

function pickNewChaosHand(currentHand) {
  // Mirror the game: core 7 first, then extras. Shuffle non-core slots.
  const core = chaosCardPool.slice(0, 7);
  const extra = chaosCardPool.slice(7);
  // Shuffle both pools
  const shuffledCore  = [...core].sort(() => Math.random() - 0.5);
  const shuffledExtra = [...extra].sort(() => Math.random() - 0.5);
  // Interleave: core[0], extra[0], core[1], extra[1] ...
  const interleaved = [];
  const len = Math.max(shuffledCore.length, shuffledExtra.length);
  for (let i = 0; i < len; i++) {
    if (shuffledCore[i])  interleaved.push(shuffledCore[i]);
    if (shuffledExtra[i]) interleaved.push(shuffledExtra[i]);
  }
  // Hand size matches current hand count (minimum 4)
  const handSize = currentHand ? currentHand.length : 4;
  return interleaved.slice(0, handSize);
}

function shuffleCards() {
  if (isKare || isShuffling) return;
  isShuffling = true;
  document.getElementById('cards-section').classList.add('shuffling');

  // Close popup & clear selection before animating
  document.getElementById('skill-popup').classList.remove('visible');
  selectedSkill = null;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.slot.empty').forEach(s => s.classList.remove('selectable'));

  const cardEls  = document.querySelectorAll('#cards-row .card');
  const newHand  = pickNewChaosHand(chaosCurrentHand);
  const promises = [];

  cardEls.forEach((el, i) => {
    promises.push(animateCardReel(el, newHand[i], i * 120));
  });

  // After the last card finishes, commit the new hand
  Promise.all(promises).then(() => {
    chaosCurrentHand = newHand;
    isShuffling = false;
    document.getElementById('cards-section').classList.remove('shuffling');
    // Re-wire click events on newly-updated cards
    rewireCardClicks();
  });
}

function rewireCardClicks() {
  const cards  = chaosCurrentHand || chaosCards;
  const row    = document.getElementById('cards-row');
  const cardEls = row.querySelectorAll('.card');
  cardEls.forEach((el, idx) => {
    const sk = cards[idx];
    if (!sk || sk.onCd) return;
    // Remove old listeners by cloning
    const fresh = el.cloneNode(true);
    el.parentNode.replaceChild(fresh, el);
    fresh.addEventListener('click', (e) => {
      e.stopPropagation();
      const popup   = document.getElementById('skill-popup');
      const isSame  = selectedSkill === sk.name;
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      selectedSkill = null;
      popup.classList.remove('visible');
      if (!isSame) {
        fresh.classList.add('selected');
        selectedSkill = sk.name;
        document.getElementById('popup-name').textContent = sk.name;
        document.getElementById('popup-cost').textContent = `Cost: ${sk.cost} Energy`;
        document.getElementById('popup-dmg').textContent  = sk.dmg > 0 ? `Damage: ${sk.dmg}` : (sk.nrg ? `Energy regen: ${sk.nrg}` : `Type: ${sk.type}`);
        document.getElementById('popup-cd').textContent   = sk.cd > 0 ? `Cooldown: ${sk.cd} turns` : '';
        document.getElementById('popup-desc').textContent = sk.desc;
        popup.classList.add('visible');
      }
      document.querySelectorAll('.slot.empty').forEach(s => {
        if (selectedSkill) s.classList.add('selectable');
        else               s.classList.remove('selectable');
      });
    });
  });
}

// ─────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────
function setMode(mode) {
  isKare = mode === 'kare';
  chaosCurrentHand = null; // reset hand when switching modes
  document.getElementById('btn-kare').classList.toggle('active', isKare);
  document.getElementById('btn-chaos').classList.toggle('active', !isKare);
  render();
}

function setEnemyMode(mode) {
  isMulti = mode === 'multi';
  document.getElementById('btn-single').classList.toggle('active', !isMulti);
  document.getElementById('btn-multi').classList.toggle('active', isMulti);
  render();
}

function toggleExec() {
  isExec = !isExec;
  const btn = document.getElementById('btn-exec');
  btn.textContent = isExec ? 'Back to Selection Phase' : 'Show Damage Box (Execution Phase)';
  btn.classList.toggle('active', isExec);
  render();
}

// ─────────────────────────────────────────
// TAUNT BUBBLE
// showTaunt(speaker, text, pos)
//   pos: 'pos-single' | 'pos-left' | 'pos-right'
//   auto-dismisses after 2.5s
// ─────────────────────────────────────────
let tauntTimer = null;
function showTaunt(speaker, text, pos = 'pos-single') {
  if (tauntTimer) clearTimeout(tauntTimer);
  const el      = document.getElementById('taunt-bubble');
  const spkEl   = document.getElementById('taunt-speaker');
  const txtEl   = document.getElementById('taunt-text');

  spkEl.textContent = speaker;
  txtEl.textContent = text;
  el.className = 'taunt-bubble ' + pos;
  el.style.animation = 'none';
  el.offsetHeight; // reflow to restart animation
  el.style.animation = '';
  el.style.display = 'block';

  tauntTimer = setTimeout(() => {
    el.style.animation = 'tauntOut 0.25s ease forwards';
    tauntTimer = setTimeout(() => { el.style.display = 'none'; }, 260);
  }, 2500);
}

const TAUNTS = {
  single: [
    ["Butter", "haha!! no way you are surviving this"],
    ["Butter", "is that really all you've got?"],
    ["Butter", "okay but like... you tried"],
  ],
  multi: [
    ["Butter", "sorry, Kare.", "pos-left"],
    ["Ava",    "every civilization must fall.", "pos-right"],
    ["Butter", "we're not even trying yet.", "pos-left"],
    ["Ava",    "resistance is statistically futile.", "pos-right"],
  ],
};

function onConfirm() {
  if (isShuffling) return;
  if (!isKare) shuffleCards();

  const pool = isMulti ? TAUNTS.multi : TAUNTS.single;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  showTaunt(...pick);
}

// Wire confirm button via JS (avoids inline onclick scope issues)
document.getElementById('confirm-btn').addEventListener('click', onConfirm);

render();
